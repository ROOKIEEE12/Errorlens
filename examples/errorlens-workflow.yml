# Copy to .github/workflows/errorlens.yml in YOUR repo (replace the `uses:` line with your published action).
name: ErrorLens Failure Analysis
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
permissions:
  actions: read
  pull-requests: write
jobs:
  analyze-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # so the action folder is available
      - uses: ./                           # or: ROOKIEEE12/errorlens@v1
        with:
          post-comment: "true"
