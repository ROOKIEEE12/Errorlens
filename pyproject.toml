[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "errorlens"
version = "0.2.0"
description = "Local-first debugging assistant for build logs and tracebacks"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "rich>=13", "pydantic>=2"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
ocr = ["pillow>=10", "pytesseract>=0.3.10"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "pillow>=10", "pytesseract>=0.3.10"]

[project.scripts]
errorlens = "errorlens.cli:app"

[tool.setuptools.packages.find]
include = ["errorlens*"]
